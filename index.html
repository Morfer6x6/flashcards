<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Flashcards</h1>

    <form id="card-form" novalidate>
      <div class="field">
        <label for="question">Question</label>
        <input type="text" id="question" name="question" autocomplete="off">
      </div>

      <div class="field">
        <label for="answer">Answer</label>
        <input type="text" id="answer" name="answer" autocomplete="off">
      </div>

      <button type="submit">Add card</button>

      <p id="form-error" class="error" role="alert"></p>
    </form>

    <section id="card-list-section">
      <h2>Your cards</h2>
      <p id="empty-message">No cards yet. Add your first card above.</p>
      <ul id="card-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
